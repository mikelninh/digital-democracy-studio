name: ZSI Watchtower

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - 'scripts/zsi_watchtower.py'
      - 'zero-suffering-intelligence/watchtower/sources.json'
      - '.github/workflows/zsi-watchtower.yml'

permissions:
  contents: write

concurrency:
  group: zsi-watchtower
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch, fingerprint and compare sources
        run: python scripts/zsi_watchtower.py

      - name: Commit Watchtower state
        run: |
          git config user.name 'zsi-watchtower[bot]'
          git config user.email 'zsi-watchtower[bot]@users.noreply.github.com'
          git add zero-suffering-intelligence/watchtower
          if git diff --cached --quiet; then
            echo 'No Watchtower state changes.'
            exit 0
          fi
          git commit -m 'chore(zsi): update Watchtower source state'
          git push
