name: ZSI Watchtower
# control-run marker: 0.9.0
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  push:
    paths:
      - scripts/zsi_watchtower.py
      - zero-suffering-intelligence/watchtower/sources.json
      - .github/workflows/zsi-watchtower.yml
permissions:
  contents: write
concurrency:
  group: zsi-watchtower
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/zsi_watchtower.py
      - name: Save state
        run: |
          git config user.name zsi-watchtower
          git config user.email actions@users.noreply.github.com
          git add zero-suffering-intelligence/watchtower
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'update Watchtower state'
          git pull --rebase origin main
          git push origin HEAD:main
