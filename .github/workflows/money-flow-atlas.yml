name: SafeTrace Money Flow Atlas

on:
  pull_request:
    paths:
      - 'safetrace/money_flow_atlas/**'
      - 'safetrace/index.html'
      - '.github/workflows/money-flow-atlas.yml'
      - 'AGENTS.md'
      - 'docs/FRONTEND_INFORMATION_ARCHITECTURE.md'
  push:
    branches: [main]
    paths:
      - 'safetrace/money_flow_atlas/**'
      - 'safetrace/index.html'
      - '.github/workflows/money-flow-atlas.yml'
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate money-flow evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('safetrace/money_flow_atlas')
          data=json.loads((root/'snapshot.json').read_text(encoding='utf-8'))
          html=(root/'index.html').read_text(encoding='utf-8')
          assert data['snapshot_id']=='DE-MONEY-FLOW-2026-09-01'
          m=data['metrics']
          assert m['top10_share_pct']==59.48
          assert 2.16 < m['bottom50_share_pct_derived'] < 2.18
          assert m['poverty_risk_people_m']==13.3
          assert m['federal_budget_2026_bn']>500
          ids=set()
          for s in data['sources']:
              assert s['id'] not in ids; ids.add(s['id'])
              assert s['url'].startswith('https://')
              for key in ('title','publisher','authority','source_type','period','exact_location','does_not_prove'):
                  assert str(s[key]).strip(), (s['id'],key)
              assert s['supports'] and all(x.strip() for x in s['supports'])
          for phrase in [
              'Where is the money',
              'Live money-flow map',
              'What I would change',
              'Scale calculator',
              'These calculations answer only',
              'a tax proposal or revenue forecast',
              'Automatic entitlement before new programmes',
              'Give every public euro a Distribution Score',
              'Build the first end-to-end distribution experiment'
          ]:
              assert phrase in html, phrase
          assert 'font:18px/1.6' in html
          assert 'font-size:15px' in html
          print('Money Flow Atlas evidence contract: OK')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Browser-verify information architecture
        run: |
          mkdir -p artifacts/money-flow-atlas
          python - <<'PY'
          import subprocess,time
          from playwright.sync_api import sync_playwright
          server=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
              time.sleep(.6)
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  page=browser.new_page(viewport={'width':1440,'height':1050})
                  errors=[]; page.on('pageerror',lambda e:errors.append(str(e)))
                  url='http://127.0.0.1:8765/safetrace/money_flow_atlas/'
                  page.goto(url,wait_until='domcontentloaded')
                  page.wait_for_timeout(900)
                  assert not errors,errors
                  assert 'Where is the money' in page.locator('h1').inner_text()
                  assert float(page.locator('body').evaluate("e=>parseFloat(getComputedStyle(e).fontSize)"))>=17
                  assert float(page.locator('.source-btn').first.evaluate("e=>parseFloat(getComputedStyle(e).fontSize)"))>=15
                  assert page.locator('.kpi').count()==3
                  assert page.locator('.flow-node').count()>=6
                  body=page.locator('body').inner_text()
                  for phrase in ['59.48%','13.3m','€524.5bn','16.1%','30.3% singles','Automatic entitlement','Distribution Score']:
                      assert phrase in body,phrase
                  page.screenshot(path='artifacts/money-flow-atlas/01-overview-desktop.png',full_page=True)

                  # Evidence drawer exposes original authority and boundary.
                  page.locator('[data-source="W2"]').first.click()
                  page.locator('#sourceOverlay.show').wait_for(state='visible')
                  assert 'European Central Bank' in page.locator('#sourcePublisher').inner_text()
                  assert '59.48%' in page.locator('#sourceSupports').inner_text()
                  assert 'data.ecb.europa.eu' in page.locator('#sourceUrl').get_attribute('href')
                  assert 'does not prove' in page.locator('.limit').inner_text().lower()
                  page.screenshot(path='artifacts/money-flow-atlas/02-source-drawer.png')
                  page.locator('#closeSource').click()

                  # Scale calculator is arithmetic, not a forecast.
                  page.locator('#subsidySlider').fill('10')
                  assert '€7.78bn/year' in page.locator('#subsidyPool').inner_text()
                  assert '€48.75/month' in page.locator('#subsidyMonthly').inner_text()
                  page.locator('#wealthSlider').fill('0.1')
                  assert '€11.84bn/year' in page.locator('#wealthPool').inner_text()
                  assert 'not a tax proposal or revenue forecast' in page.locator('.sim-card').nth(1).inner_text().lower()

                  # Mobile readability.
                  mobile=browser.new_page(viewport={'width':390,'height':844})
                  mobile.goto(url,wait_until='domcontentloaded');mobile.wait_for_timeout(700)
                  assert float(mobile.locator('body').evaluate("e=>parseFloat(getComputedStyle(e).fontSize)"))>=16
                  assert mobile.locator('h1').is_visible()
                  mobile.screenshot(path='artifacts/money-flow-atlas/03-mobile.png',full_page=True)
                  mobile.close();browser.close()
          finally:
              server.terminate();server.wait(timeout=5)
          PY
      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: money-flow-atlas-browser-proof
          path: artifacts/money-flow-atlas/
          if-no-files-found: error
