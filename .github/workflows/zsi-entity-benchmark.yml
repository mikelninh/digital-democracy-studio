name: ZSI Entity Resolution Benchmark
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/zsi_entity_benchmark.py
      - scripts/zsi_entity_benchmark_v11.py
      - zero-suffering-intelligence/entity-resolution/benchmark-v1.json
      - .github/workflows/zsi-entity-benchmark.yml
permissions:
  contents: write
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/zsi_entity_benchmark.py
      - run: python scripts/zsi_entity_benchmark_v11.py
      - name: Save results
        run: |
          git config user.name zsi-benchmark
          git config user.email actions@users.noreply.github.com
          git add zero-suffering-intelligence/entity-resolution/results-v1.json zero-suffering-intelligence/entity-resolution/results-v11.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'update entity benchmark results'
          git pull --rebase origin main
          git push origin HEAD:main
