name: Intelligence Live Company Investigation

on:
  pull_request:
    paths:
      - 'safetrace/intelligence_casework/company_live.py'
      - 'safetrace/intelligence_casework/company_live_resilient.py'
      - 'safetrace/intelligence_casework/company_live_production.py'
      - 'safetrace/intelligence_casework/fixtures/venatic_live.json'
      - 'safetrace/intelligence_casework/tests/test_company_live.py'
      - 'safetrace/intelligence_casework/tests/test_company_live_resilient.py'
      - 'safetrace/intelligence_casework/tests/test_company_live_production.py'
      - 'safetrace/intelligence_casework/live/**'
      - '.github/workflows/intelligence-live-company.yml'
  workflow_dispatch:
  schedule:
    - cron: '17 5 * * 1'

jobs:
  investigate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser acquisition dependency
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Regression tests
        run: |
          python -m unittest safetrace.intelligence_casework.tests.test_company_live -v
          python -m unittest safetrace.intelligence_casework.tests.test_company_live_resilient -v
          python -m unittest safetrace.intelligence_casework.tests.test_company_live_production -v
      - name: Acquire live public sources and investigate Venatic
        run: |
          rm -rf artifacts/intelligence-casework/venatic-live
          python -m safetrace.intelligence_casework.company_live_production \
            --case safetrace/intelligence_casework/fixtures/venatic_live.json \
            --out artifacts/intelligence-casework/venatic-live \
            --minimum-sources 1 \
            --minimum-claims 4
      - name: Validate investigation contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/intelligence-casework/venatic-live/result.json')
          r = json.loads(p.read_text())
          assert r['schema_version'] == 'safetrace.live-company-investigation/2.2'
          assert r['integrity']['status'] == 'pass'
          assert r['run']['acquisition_adapter'] == 'direct_retry_plus_explicit_browser_render/2.3'
          assert r['metrics']['sources_requested'] == 4
          assert r['metrics']['sources_acquired'] >= 1
          assert r['metrics']['claims'] >= 4
          assert r['metrics']['extraction_gaps'] == sum(len(s['required_not_found']) for s in r['sources'])
          assert any(c['field'] == 'legal_name' for c in r['claims'])
          capital_claims = [c for c in r['claims'] if c['field'] == 'share_capital_eur']
          assert all(c['value'] == '25000' for c in capital_claims), capital_claims
          register_source = next(s for s in r['sources'] if s['id'] == 'online-register-profile')
          if register_source['acquisition_status'] == 'acquired':
              assert any(c['field'] == 'register_id' for c in r['claims'])
              assert capital_claims
          else:
              assert any(g['field'] == 'register_id' and g['status'] == 'not_established' for g in r['unresolved_questions'])
          official = next(s for s in r['sources'] if s['id'] == 'venatic-official')
          if official['acquisition_status'] == 'acquired':
              assert official['facts_extracted'] >= 4, official
          assert any(g['field'] == 'shareholders' for g in r['unresolved_questions'])
          assert all(s['sha256'] and s['receipt_hash'] for s in r['sources'] if s['acquisition_status'] == 'acquired')
          assert all(s['error'] for s in r['sources'] if s['acquisition_status'] != 'acquired')
          report = Path('artifacts/intelligence-casework/venatic-live/report.md').read_text()
          assert '403 equivalent success' not in report
          assert 'Still unknown' in Path('artifacts/intelligence-casework/venatic-live/index.html').read_text()
          print(json.dumps(r['metrics'], indent=2))
          print('\nSOURCE STATUS')
          for s in r['sources']:
              print(f"- {s['id']}: {s['acquisition_status']} http={s['http_status']} facts={s['facts_extracted']} missing={','.join(s['required_not_found']) or '-'}")
          print('\nCLAIMS')
          for c in r['claims']:
              print(f"- {c['field']}: {c['value']} [{c['status']}] {c['confidence']:.0%}")
          print('\nUNRESOLVED')
          for g in r['unresolved_questions']:
              print(f"- {g['title']}: {g['status']} -> {g['next_step']}")
          PY
      - name: Print analyst report
        run: cat artifacts/intelligence-casework/venatic-live/report.md
      - name: Upload investigation work product
        uses: actions/upload-artifact@v4
        with:
          name: venatic-live-investigation
          path: artifacts/intelligence-casework/venatic-live/
          if-no-files-found: error
