name: Intelligence Casework Proof

on:
  push:
    paths:
      - 'safetrace/intelligence_casework/**'
      - 'zero-suffering-intelligence/entity-resolution/**'
      - '.github/workflows/intelligence-casework.yml'
  pull_request:
    paths:
      - 'safetrace/intelligence_casework/**'
      - 'zero-suffering-intelligence/entity-resolution/**'
      - '.github/workflows/intelligence-casework.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate synthetic intelligence case
        run: python safetrace/intelligence_casework/validate_case.py
      - name: Re-run working investigation and verify committed results
        run: python -m safetrace.intelligence_casework.run_case --check
      - name: Run all intelligence casework tests
        run: python -m unittest discover -s safetrace/intelligence_casework/tests -v
      - name: Assert investigation outcome contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r = json.loads(Path('safetrace/intelligence_casework/results/v001_result.json').read_text(encoding='utf-8'))
          e = r['executive_result']
          assert r['status'] == 'completed'
          assert e['decision'] == 'ENHANCED_DUE_DILIGENCE_REQUIRED'
          assert e['confirmed_sanctions_match'] is False
          assert e['material_findings'] == 3
          assert e['open_actions'] == 4
          assert any(x['effective_interest'] == 0.42 for x in r['ownership']['paths'])
          assert any(x['effective_interest'] == 0.28 for x in r['ownership']['paths'])
          print('PASS: V-001 produced the expected bounded analyst result')
          PY
      - name: Re-run frozen entity-resolution holdout
        run: python scripts/zsi_entity_holdout.py
      - name: Verify holdout result remains committed and honest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('zero-suffering-intelligence/entity-resolution/results-holdout-v1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          m = d['metrics']
          assert d['cases'] == 30
          assert m['precision'] == 0.9231
          assert m['recall'] == 0.8571
          assert m['f1'] == 0.8889
          assert len(d['errors']) == 3
          assert 'fresh holdout-v2' in d['guardrail']
          print('PASS: frozen holdout metrics and anti-leakage guardrail preserved')
          PY
