name: Citizen Portal

on:
  pull_request:
    paths:
      - "safetrace/citizen_portal/**"
      - ".github/ISSUE_TEMPLATE/citizen-public-source-case.yml"
      - ".github/workflows/citizen-portal.yml"
  push:
    branches: [main]
    paths:
      - "safetrace/citizen_portal/**"
      - ".github/ISSUE_TEMPLATE/citizen-public-source-case.yml"
      - ".github/workflows/citizen-portal.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate candidate radar and public safety boundaries
        run: python safetrace/citizen_portal/validate.py
