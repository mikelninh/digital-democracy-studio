name: Venatic Real Investigations Proof

on:
  pull_request:
    paths:
      - 'safetrace/venatic_application/**'
      - 'docs/FRONTEND_INFORMATION_ARCHITECTURE.md'
      - 'AGENTS.md'
      - '.github/workflows/venatic-real-investigation.yml'
  push:
    branches: [main]
    paths:
      - 'safetrace/venatic_application/**'
      - 'docs/FRONTEND_INFORMATION_ARCHITECTURE.md'
      - 'AGENTS.md'
      - '.github/workflows/venatic-real-investigation.yml'
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate fast investigation contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('safetrace/venatic_application')
          hub = (root/'index.html').read_text(encoding='utf-8')
          css = (root/'assets/investigation.css').read_text(encoding='utf-8')
          decision_js = (root/'assets/analyst-decision.js').read_text(encoding='utf-8')

          assert '60-second analyst challenge' in hub.lower()
          assert 'Make the call with me' in hub
          assert '.analyst-decision' in css
          assert 'data-analyst-decision' in decision_js

          cases = {
            'real': ('REAL-DE-MEAT-LOBBY-001', 10),
            'defence': ('REAL-DE-DEFENCE-MONEY-001', 9),
            'shadow-fleet': ('REAL-RU-SHADOW-FLEET-001', 7),
          }
          for path,(case_id,minimum) in cases.items():
              html=(root/path/'index.html').read_text(encoding='utf-8')
              data=json.loads((root/path/'sources.json').read_text(encoding='utf-8'))
              assert data['case_id']==case_id
              assert len(data['sources'])>=minimum
              for term in ('data-analyst-decision','data-reveal-target="#assessment"','Current assessment','Biggest open gap','Best next move','Original evidence','Open original source','analyst-decision.js'):
                  assert term in html,(path,term)
              assert html.count('class="section"') <= 2, (path,'too many default sections')
              ids=set()
              for source in data['sources']:
                  assert source['id'] not in ids
                  ids.add(source['id'])
                  assert source['url'].startswith('https://')
                  for key in ('publisher','authority','source_type','exact_location','does_not_prove'):
                      assert source[key].strip(),(path,source['id'],key)
                  assert source['supports'] and all(x.strip() for x in source['supports'])
          print('Fast investigation contracts: OK')
          PY

      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium

      - name: Browser-test decision → reveal → source path
        run: |
          mkdir -p artifacts/venatic-real
          python - <<'PY'
          import subprocess,time
          from playwright.sync_api import sync_playwright

          base='http://127.0.0.1:8765/safetrace/venatic_application/'
          server=subprocess.Popen(['python','-m','http.server','8765'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)
          try:
            time.sleep(.6)
            with sync_playwright() as p:
              browser=p.chromium.launch(headless=True)
              page=browser.new_page(viewport={'width':1440,'height':1000})
              errors=[]
              page.on('pageerror',lambda e:errors.append(str(e)))

              page.goto(base,wait_until='networkidle')
              assert page.locator('.case-card').count()==3
              assert 'make the call with me' in page.locator('h1').inner_text().lower()
              assert len(page.locator('body').inner_text().split()) < 850
              page.screenshot(path='artifacts/venatic-real/00-hub.png',full_page=True)

              cases=[
                ('policy','real/','did the meat industry get a policy change it asked for?','S9'),
                ('defence','defence/','what does an “up to €8.5bn” defence contract actually mean?','D2'),
                ('shadow','shadow-fleet/','same tanker after a rename — or a different asset?','S3'),
              ]
              for name,path,title,source_id in cases:
                page.goto(base+path,wait_until='networkidle')
                assert not errors,errors
                body=page.locator('body').inner_text()
                assert title.lower() in body.lower()
                assert len(body.split()) < 900,(name,len(body.split()))
                assert page.locator('#assessment').is_hidden()
                assert page.locator('[data-analyst-decision]').is_visible()
                correct=page.locator('[data-choice][data-correct="true"]')
                correct.click()
                assert page.locator('[data-decision-feedback]').is_visible()
                assert 'good call' in page.locator('[data-decision-feedback]').inner_text().lower()
                page.locator('[data-reveal-assessment]').click()
                assert page.locator('#assessment').is_visible()
                page.locator(f'[data-source="{source_id}"]').first.click()
                page.locator('#sourceOverlay.show').wait_for(state='visible')
                assert page.locator('#sourceUrl').get_attribute('href').startswith('https://')
                page.screenshot(path=f'artifacts/venatic-real/{name}.png',full_page=True)
                page.locator('#closeSource').click()

              mobile=browser.new_page(viewport={'width':390,'height':844})
              for name,path,_,_ in cases:
                mobile.goto(base+path,wait_until='networkidle')
                assert mobile.locator('[data-analyst-decision]').is_visible()
                assert float(mobile.locator('body').evaluate("el=>parseFloat(getComputedStyle(el).fontSize)")) >= 16
                mobile.screenshot(path=f'artifacts/venatic-real/mobile-{name}.png',full_page=True)
              mobile.close();browser.close()
          finally:
            server.terminate();server.wait(timeout=5)
          PY

      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: venatic-60-second-proof
          path: artifacts/venatic-real/
          if-no-files-found: error
