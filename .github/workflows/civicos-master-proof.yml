name: CivicOS Master Proof

on:
  push:
    paths:
      - 'safetrace/master_proof/**'
      - '.github/workflows/civicos-master-proof.yml'
  pull_request:
    paths:
      - 'safetrace/master_proof/**'
      - '.github/workflows/civicos-master-proof.yml'

jobs:
  golden-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ontology, golden cases and approval boundaries
        run: python safetrace/master_proof/test_master_proof.py
