name: Animal Welfare Evidence Series

on:
  pull_request:
    paths:
      - "safetrace/animal_welfare_series/**"
      - ".github/ISSUE_TEMPLATE/animal-welfare-public-source-case.yml"
      - ".github/workflows/animal-welfare-series.yml"
  push:
    branches: [main]
    paths:
      - "safetrace/animal_welfare_series/**"
      - ".github/ISSUE_TEMPLATE/animal-welfare-public-source-case.yml"
      - ".github/workflows/animal-welfare-series.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate public case catalog and safety boundaries
        run: python safetrace/animal_welfare_series/validate.py
