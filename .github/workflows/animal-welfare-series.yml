name: Animal Welfare Evidence Series

on:
  pull_request:
    paths:
      - "safetrace/animal_welfare_series/**"
      - ".github/ISSUE_TEMPLATE/animal-welfare-public-source-case.yml"
      - ".github/ISSUE_TEMPLATE/animal-welfare-correction.yml"
      - ".github/ISSUE_TEMPLATE/animal-welfare-complaint.yml"
      - ".github/ISSUE_TEMPLATE/animal-welfare-review.yml"
      - ".github/workflows/animal-welfare-series.yml"
  push:
    branches: [main]
    paths:
      - "safetrace/animal_welfare_series/**"
      - ".github/ISSUE_TEMPLATE/animal-welfare-public-source-case.yml"
      - ".github/ISSUE_TEMPLATE/animal-welfare-correction.yml"
      - ".github/ISSUE_TEMPLATE/animal-welfare-complaint.yml"
      - ".github/ISSUE_TEMPLATE/animal-welfare-review.yml"
      - ".github/workflows/animal-welfare-series.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify transparent priority totals
        run: python safetrace/animal_welfare_series/prioritize.py --json
      - name: Run static accessibility and privacy guard
        run: python safetrace/animal_welfare_series/accessibility_check.py
      - name: Validate catalog governance and safety boundaries
        run: python safetrace/animal_welfare_series/validate.py
