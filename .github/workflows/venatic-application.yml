name: Venatic Application Browser Proof

on:
  pull_request:
    paths:
      - 'safetrace/venatic_application/**'
      - 'safetrace/venatic_challenge/**'
      - '.github/workflows/venatic-application.yml'
  push:
    branches: [main]
    paths:
      - 'safetrace/venatic_application/**'
      - '.github/workflows/venatic-application.yml'
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate application and challenge contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('safetrace/venatic_application')
          assert (root / 'index.html').exists()
          case = json.loads(Path('safetrace/venatic_challenge/case_v002.json').read_text(encoding='utf-8'))
          assert len(case['source_records']) == 28
          assert sum(s['availability'] == 'initial' for s in case['source_records']) == 18
          assert sum(s['availability'] == 'optional' for s in case['source_records']) == 10
          html = (root / 'index.html').read_text(encoding='utf-8')
          for phrase in ['Try three investigations.','Who really owns this company?','Is this sanctions hit real?','Who owns the warehouse?','95/100','100/100']:
              assert phrase in html, phrase
          assert 'APPLICATION_MESSAGE.md' not in html
          assert "I didn't want to tell you I could do the work" not in html
          print('Simplified application contract: OK')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Browser-verify three-case HR journey
        run: |
          mkdir -p artifacts/venatic-application
          python - <<'PY'
          import subprocess, time
          from playwright.sync_api import sync_playwright

          server = subprocess.Popen(['python','-m','http.server','8765'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(0.5)
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width': 1440, 'height': 1000})
                  errors = []
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/safetrace/venatic_application/', wait_until='networkidle')
                  assert not errors, errors
                  assert page.locator('h1').inner_text() == 'Try three investigations.'
                  assert page.locator('.case-card').count() == 3
                  assert page.locator('.pane.active').get_attribute('id') == 'ownership'
                  page.screenshot(path='artifacts/venatic-application/01-overview.png', full_page=True)

                  page.locator('#ownership .choice[data-answer="correct"]').click()
                  assert '36.4%' in page.locator('#result-ownership').inner_text()
                  assert page.locator('#d1').evaluate('(el) => el.classList.contains("done")')
                  page.screenshot(path='artifacts/venatic-application/02-ownership-aha.png', full_page=True)

                  page.locator('#result-ownership [data-next="sanctions"]').click()
                  assert page.locator('.pane.active').get_attribute('id') == 'sanctions'
                  page.locator('#sanctions .choice[data-answer="correct"]').click()
                  assert 'NOT SAME PERSON' in page.locator('#result-sanctions').inner_text()
                  assert page.locator('#d2').evaluate('(el) => el.classList.contains("done")')

                  page.locator('#result-sanctions [data-next="asset"]').click()
                  assert page.locator('.pane.active').get_attribute('id') == 'asset'
                  page.locator('#asset .choice[data-answer="correct"]').click()
                  assert 'land register' in page.locator('#asset').inner_text().lower()
                  assert page.locator('#d3').evaluate('(el) => el.classList.contains("done")')

                  page.locator('#result-asset [data-finish]').click()
                  assert page.locator('#complete').evaluate('(el) => el.classList.contains("show")')
                  final = page.locator('#complete').inner_text()
                  assert '95/100' in final and '100/100' in final and 'critical overclaims' in final
                  page.screenshot(path='artifacts/venatic-application/03-finish.png', full_page=True)
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY
      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: venatic-application-browser-proof
          path: artifacts/venatic-application/
          if-no-files-found: error
