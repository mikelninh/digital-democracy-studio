name: Venatic Application Browser Proof

on:
  pull_request:
    paths:
      - 'safetrace/venatic_application/**'
      - 'safetrace/venatic_challenge/**'
      - '.github/workflows/venatic-application.yml'
  push:
    branches: [main]
    paths:
      - 'safetrace/venatic_application/**'
      - '.github/workflows/venatic-application.yml'
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate clean guided experience contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path('safetrace/venatic_application/index.html').read_text(encoding='utf-8')
          case = json.loads(Path('safetrace/venatic_challenge/case_v002.json').read_text(encoding='utf-8'))
          assert len(case['source_records']) == 28
          for phrase in [
              'Three messy investigations. Three clear answers.',
              '80% × 70% × 65% =',
              '36.4%',
              'Still unknown',
              'Reject the match.',
              'Atlas Property SPV GmbH owns it.',
              'Next best research step',
              'Make the conclusion obvious. Keep the evidence one click away.'
          ]:
              assert phrase in html, phrase
          for removed in ['I’m ready to decide', 'Sources opened:', 'What can you safely conclude?', 'data-case-choice']:
              assert removed not in html, removed
          print('Clean guided investigation contract: OK')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Browser-verify obvious visual answers and source proof
        run: |
          mkdir -p artifacts/venatic-application
          python - <<'PY'
          import subprocess, time
          from playwright.sync_api import sync_playwright

          server = subprocess.Popen(['python','-m','http.server','8765'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(0.5)
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width': 1440, 'height': 1050})
                  errors=[]
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/safetrace/venatic_application/', wait_until='networkidle')
                  assert not errors, errors

                  # First impression is simple and answer-led.
                  assert page.locator('h1').inner_text() == 'Three messy investigations. Three clear answers.'
                  ownership = page.locator('#ownership').inner_text()
                  assert '80% × 70% × 65% =' in ownership
                  assert '36.4%' in ownership
                  assert 'unknown' in ownership.lower()
                  assert 'I’m ready to decide' not in page.locator('body').inner_text()
                  page.screenshot(path='artifacts/venatic-application/01-clean-overview.png', full_page=True)

                  # Source proof remains one click away.
                  page.locator('#ownership [data-proof="S06"]').click()
                  assert page.locator('#overlay').evaluate('(el)=>el.classList.contains("show")')
                  assert 'Mihailo Petrović owns 80%' in page.locator('#proofFact').inner_text()
                  page.screenshot(path='artifacts/venatic-application/02-source-proof.png', full_page=True)
                  page.locator('#close').click()

                  # Sanctions case is a visual mismatch, conclusion already obvious.
                  sanctions = page.locator('#sanctions').inner_text()
                  assert 'Reject the match.' in sanctions
                  assert sanctions.lower().count('mismatch') >= 3
                  page.locator('#sanctions [data-proof="S08"]').click()
                  assert 'DOB 03 Jan 1972' in page.locator('#proofFact').inner_text()
                  page.locator('#close').click()

                  # Asset case separates legal owner, operator and security holder visually.
                  asset = page.locator('#asset').inner_text()
                  assert 'Atlas Property SPV GmbH owns it.' in asset
                  assert 'LEGAL TITLE' in asset
                  assert 'OPERATOR / TENANT' in asset
                  assert 'LENDER / SECURITY' in asset
                  page.locator('#asset [data-proof="S17_O"]').click()
                  assert 'Registered legal owner: Atlas Property SPV GmbH.' in page.locator('#proofFact').inner_text()
                  page.locator('#close').click()
                  page.screenshot(path='artifacts/venatic-application/03-asset-answer.png', full_page=True)

                  # Supporting benchmark stays secondary, after the aha.
                  payoff = page.locator('.payoff').inner_text()
                  assert '95 → 100' in payoff and '0' in payoff
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY
      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: venatic-application-browser-proof
          path: artifacts/venatic-application/
          if-no-files-found: error
