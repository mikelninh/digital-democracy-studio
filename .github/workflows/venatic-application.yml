name: Venatic Application Browser Proof

on:
  pull_request:
    paths:
      - 'safetrace/venatic_application/**'
      - 'safetrace/venatic_challenge/**'
      - '.github/workflows/venatic-application.yml'
  push:
    branches: [main]
    paths:
      - 'safetrace/venatic_application/**'
      - '.github/workflows/venatic-application.yml'
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate minimal HR experience contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          html = Path('safetrace/venatic_application/index.html').read_text(encoding='utf-8')
          case = json.loads(Path('safetrace/venatic_challenge/case_v002.json').read_text(encoding='utf-8'))
          assert len(case['source_records']) == 28
          for phrase in [
              'Who really owns Meridian Atlas?',
              '36.4% indirect ownership',
              'Same person?',
              'Not the same person.',
              'Who owns the warehouse?',
              'Atlas Property SPV GmbH owns it.',
              'Find the answer. Show the proof. Keep unknowns unknown.',
              '0</b><span>critical overclaims'
          ]:
              assert phrase in html, phrase
          for forbidden in ['choice', 'case-tab', 'APPLICATION_MESSAGE.md', '95 → 100']:
              assert forbidden not in html, forbidden
          print('Minimal HR experience contract: OK')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Browser-verify minimal evidence journey
        run: |
          mkdir -p artifacts/venatic-application
          python - <<'PY'
          import subprocess, time
          from playwright.sync_api import sync_playwright

          server = subprocess.Popen(['python','-m','http.server','8765'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(0.5)
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width': 1440, 'height': 1000})
                  errors=[]
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/safetrace/venatic_application/', wait_until='networkidle')
                  assert not errors, errors
                  assert page.locator('.case.active').get_attribute('id') == 'case1'
                  assert page.locator('#case1 h1').inner_text() == 'Who really owns Meridian Atlas?'
                  assert page.locator('#case1 .relation').count() == 3
                  assert '36.4% indirect ownership' in page.locator('#case1 .answer').inner_text()
                  assert '15% nominee stake' in page.locator('#case1').inner_text()
                  page.screenshot(path='artifacts/venatic-application/01-minimal-case.png', full_page=True)

                  page.locator('#case1 [data-proof="S06"]').click()
                  assert page.locator('#overlay').evaluate('(el)=>el.classList.contains("show")')
                  assert 'Mihailo Petrović owns 80%' in page.locator('#proofFact').inner_text()
                  page.screenshot(path='artifacts/venatic-application/02-proof-modal.png', full_page=True)
                  page.locator('#close').click()

                  page.locator('#case1 [data-next="2"]').click()
                  page.wait_for_timeout(450)
                  assert page.locator('.case.active').get_attribute('id') == 'case2'
                  assert 'Not the same person.' in page.locator('#case2 .answer').inner_text()
                  assert page.locator('#case2 .neq').count() == 3
                  page.locator('#case2 [data-proof="S08"]').click()
                  assert 'Russian nationality' in page.locator('#proofFact').inner_text()
                  page.locator('#close').click()

                  page.locator('#case2 [data-next="3"]').click()
                  page.wait_for_timeout(450)
                  assert page.locator('.case.active').get_attribute('id') == 'case3'
                  text = page.locator('#case3').inner_text()
                  for role in ['LEGAL OWNER','OPERATES','HAS SECURITY']:
                      assert role in text
                  assert 'Atlas Property SPV GmbH owns it.' in page.locator('#case3 .answer').inner_text()
                  page.locator('#case3 [data-proof="S17_O"]').click()
                  assert 'Legal owner' in page.locator('#proofFact').inner_text()
                  page.locator('#close').click()

                  page.locator('#case3 [data-finish]').click()
                  page.wait_for_timeout(450)
                  assert page.locator('#done').evaluate('(el)=>el.classList.contains("active")')
                  final = page.locator('#done').inner_text()
                  assert 'Find the answer. Show the proof. Keep unknowns unknown.' in final
                  assert '28' in final and '5' in final and 'critical overclaims' in final
                  page.screenshot(path='artifacts/venatic-application/03-finish.png', full_page=True)
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY
      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: venatic-application-browser-proof
          path: artifacts/venatic-application/
          if-no-files-found: error
