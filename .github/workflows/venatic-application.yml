name: Venatic Application Browser Proof

on:
  pull_request:
    paths:
      - 'safetrace/venatic_application/**'
      - 'safetrace/venatic_challenge/**'
      - '.github/workflows/venatic-application.yml'
  push:
    branches: [main]
    paths:
      - 'safetrace/venatic_application/**'
      - '.github/workflows/venatic-application.yml'
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate application package contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('safetrace/venatic_application')
          required = ['index.html','APPLICATION_NOTE.md','APPLICATION_MESSAGE.md','PRODUCT_ARCHITECT_STORY.md','WALKTHROUGH.md']
          for name in required:
              assert (root / name).exists(), name
          case = json.loads(Path('safetrace/venatic_challenge/case_v002.json').read_text(encoding='utf-8'))
          assert len(case['source_records']) == 28
          assert sum(s['availability'] == 'initial' for s in case['source_records']) == 18
          assert sum(s['availability'] == 'optional' for s in case['source_records']) == 10
          html = (root / 'index.html').read_text(encoding='utf-8')
          for phrase in ['95 → 100','zero critical failures','Only five more sources','Problem → system → verified outcome']:
              assert phrase in html, phrase
          print('Application package contract: OK')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Browser-verify the one-link experience
        run: |
          mkdir -p artifacts/venatic-application
          python - <<'PY'
          import subprocess, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          server = subprocess.Popen(['python','-m','http.server','8765'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(0.5)
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width': 1440, 'height': 1000})
                  errors = []
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/safetrace/venatic_application/', wait_until='networkidle')
                  assert not errors, errors
                  assert "I didn't want to tell you I could do the work" in page.locator('h1').inner_text()
                  assert page.locator('.metric').count() == 4
                  assert '95 → 100' in page.locator('.metrics').inner_text()
                  assert page.locator('.stage').count() == 4
                  assert page.locator('.hit').count() >= 3
                  page.screenshot(path='artifacts/venatic-application/application-overview.png', full_page=True)

                  page.locator('.stage[data-stage="first"]').click()
                  page.locator('.hit[data-edge="mihailo"]').click(force=True)
                  assert '36.4%' in page.locator('#evidence').inner_text()
                  page.screenshot(path='artifacts/venatic-application/application-evidence.png', full_page=True)

                  page.locator('.stage[data-stage="research"]').click()
                  assert page.locator('.source-pick').count() == 6
                  assert 'circular reporting' in page.locator('#pane-research').inner_text()

                  page.locator('.stage[data-stage="final"]').click()
                  assert '100' in page.locator('#pane-final').inner_text()
                  assert 'Still open' in page.locator('#pane-final').inner_text()
                  page.screenshot(path='artifacts/venatic-application/application-final.png', full_page=True)
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY
      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: venatic-application-browser-proof
          path: artifacts/venatic-application/
          if-no-files-found: error
