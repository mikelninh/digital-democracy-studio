name: Venatic Application Browser Proof

on:
  pull_request:
    paths:
      - 'safetrace/venatic_application/**'
      - 'safetrace/venatic_challenge/**'
      - '.github/workflows/venatic-application.yml'
  push:
    branches: [main]
    paths:
      - 'safetrace/venatic_application/**'
      - '.github/workflows/venatic-application.yml'
  workflow_dispatch:

jobs:
  browser-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate guided application contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('safetrace/venatic_application')
          html = (root / 'index.html').read_text(encoding='utf-8')
          case = json.loads(Path('safetrace/venatic_challenge/case_v002.json').read_text(encoding='utf-8'))
          assert len(case['source_records']) == 28
          for phrase in [
              'Who really owns Meridian Atlas?',
              '36.4%',
              'Not the same person.',
              'Who owns the warehouse?',
              'Atlas Property SPV GmbH',
              'View source',
              '95 → 100'
          ]:
              assert phrase in html, phrase
          assert 'choice' not in html
          assert 'case-tab' not in html
          assert 'APPLICATION_MESSAGE.md' not in html
          print('Guided HR experience contract: OK')
          PY
      - name: Install Chromium
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Browser-verify guided evidence journey
        run: |
          mkdir -p artifacts/venatic-application
          python - <<'PY'
          import subprocess, time
          from playwright.sync_api import sync_playwright

          server = subprocess.Popen(['python','-m','http.server','8765'], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          try:
              time.sleep(0.5)
              with sync_playwright() as p:
                  browser = p.chromium.launch(headless=True)
                  page = browser.new_page(viewport={'width': 1440, 'height': 1000})
                  errors=[]
                  page.on('pageerror', lambda error: errors.append(str(error)))
                  page.goto('http://127.0.0.1:8765/safetrace/venatic_application/', wait_until='networkidle')
                  assert not errors, errors
                  assert page.locator('.case.active').get_attribute('id') == 'case1'
                  assert page.locator('h1').inner_text() == 'Who really owns Meridian Atlas?'
                  assert '36.4%' in page.locator('#case1 .answer').inner_text()
                  assert page.locator('.case').count() == 3
                  assert page.locator('.choice').count() == 0
                  page.screenshot(path='artifacts/venatic-application/01-guided-case.png', full_page=True)

                  page.locator('#case1 [data-source="S06"]').click()
                  assert page.locator('#drawer').evaluate('(el)=>el.classList.contains("show")')
                  assert 'Mihailo Petrović owns 80%' in page.locator('#sourceFacts').inner_text()
                  page.screenshot(path='artifacts/venatic-application/02-source-open.png', full_page=True)
                  page.locator('#close').click()

                  page.locator('#case1 [data-next="2"]').click()
                  page.wait_for_timeout(500)
                  assert page.locator('.case.active').get_attribute('id') == 'case2'
                  assert 'Not the same person.' in page.locator('#case2 .answer').inner_text()
                  assert '19 Apr 1984' in page.locator('#case2').inner_text()
                  assert '03 Jan 1972' in page.locator('#case2').inner_text()

                  page.locator('#case2 [data-next="3"]').click()
                  page.wait_for_timeout(500)
                  assert page.locator('.case.active').get_attribute('id') == 'case3'
                  assert 'Atlas Property SPV GmbH' in page.locator('#case3 .answer').inner_text()

                  page.locator('#case3 [data-finish]').click()
                  page.wait_for_timeout(500)
                  assert page.locator('#done').evaluate('(el)=>el.classList.contains("active")')
                  assert '95 → 100' in page.locator('#done').inner_text()
                  page.screenshot(path='artifacts/venatic-application/03-finish.png', full_page=True)
                  browser.close()
          finally:
              server.terminate()
              server.wait(timeout=5)
          PY
      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: venatic-application-browser-proof
          path: artifacts/venatic-application/
          if-no-files-found: error
