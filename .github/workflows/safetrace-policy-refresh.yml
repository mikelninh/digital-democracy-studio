name: SafeTrace official-source monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire official pages and create review candidate
        id: refresh
        shell: bash
        run: |
          python -m safetrace.policy_platform.refresh \
            --root safetrace \
            --output safetrace/policy_platform/artifacts/source-monitor
          cat safetrace/policy_platform/artifacts/source-monitor/github-output.txt >> "$GITHUB_OUTPUT"
      - name: Upload immutable source-review packet
        uses: actions/upload-artifact@v4
        with:
          name: safetrace-source-review-${{ github.run_id }}
          path: safetrace/policy_platform/artifacts/source-monitor/
          if-no-files-found: error
          retention-days: 90
      - name: Open human-review issue
        if: steps.refresh.outputs.review_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          title='SafeTrace source change requires review'
          body_file='safetrace/policy_platform/artifacts/source-monitor/review.md'
          run_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          printf '\n\nActions evidence packet: %s\n' "$run_url" >> "$body_file"
          existing="$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file "$body_file"
          else
            gh issue create --title "$title" --body-file "$body_file"
          fi
